<!-- =====================================================
AUFGABE: DER HTML-ZAUBER VON HOGWARTS
=====================================================

Willkommen, junge Hexen und Zauberer!

In Hogwarts ist Chaos ausgebrochen.
Die Bibliothek hat ihre Struktur verloren,
die Navigation treibt als Irrwicht herum
und Peeves hat offene HTML-Tags versteckt.

Eure Aufgabe:
Erstellt eine strukturierte HTML-Seite für
die "Hogwarts Code-Akademie".

Nur wenn eure Webseite sauber aufgebaut ist,
kann der Browser den Zauber korrekt ausführen.

=====================================================
PFLICHT-AUFGABE: STUFE 1 - ERSTKLÄSSLER
=====================================================

Erstellt eine HTML-Datei mit vollständigem Boilerplate.

Eure Seite MUSS enthalten:

✓ <!DOCTYPE html>
✓ <html lang="de">
✓ <head> mit:
    - UTF-8
    - Viewport
    - passendem <title>

✓ <body> mit:
    - <header>
    - <nav>
    - <main>
    - <footer>

Im <header>:
✓ Eine <h1>-Überschrift

Beispiel:
"Hogwarts Code-Akademie"

Im <nav>:
✓ Eine ungeordnete Liste <ul>
✓ Mindestens 3 Listenpunkte <li>
✓ Jeder Listenpunkt enthält einen Link <a>

Beispiel:
- Startseite
- Zauberstunden
- Hauspunkte

Im <main>:
✓ Mindestens eine <section>
✓ Eine <h2>-Überschrift
✓ Einen Absatz <p>

Im <footer>:
✓ Ein Copyright mit &copy;

Beispiel:
"© 2026 Hogwarts Schule für Hexerei und Codekunst"

=====================================================
MITTLERE AUFGABE: STUFE 2 - ZAUBERSCHÜLER
=====================================================

Erweitert eure Seite um einen Abschnitt
über magische Unterrichtsfächer.

In dieser <section> sollen mindestens 2 <article>
vorkommen.

Jeder <article> enthält:

✓ Eine <h3>-Überschrift
✓ Einen Absatz <p>
✓ Mindestens ein wichtiges Wort mit <strong>

Beispiel:

Artikel 1:
Überschrift:
"Verteidigung gegen die dunklen Bugs"

Absatz:
"Professor Lupin erklärt, wie man
<strong>offene Tags</strong> erkennt und besiegt."

Artikel 2:
Überschrift:
"Zaubertränke für sauberen Code"

Absatz:
"Snape braut einen Trank gegen Syntaxfehler,
ist aber sehr enttäuscht von fehlenden Einrückungen."

=====================================================
SCHWERE AUFGABE: STUFE 3 - PREFEKT DES CODES
=====================================================

Fügt eine <aside>-Box hinzu.

Diese soll eine Zusatzinformation enthalten,
zum Beispiel einen nerdigen Hinweis.

Beispiel:

Überschrift:
"Hermine weiß es besser"

Absatz:
"Schließe immer deine HTML-Tags.<br>
Sonst verwandelt sich dein Layout schneller
als ein Vielsafttrank in völliges Chaos."

Nutzt außerdem:

✓ Mindestens ein <br> für einen Zeilenumbruch
✓ Mindestens ein <hr> als thematische Trennlinie
✓ Mindestens eine Überschrift von <h1> bis <h3>

=====================================================
BOSS-LEVEL: STUFE 4 - MEISTERZAUBERER
=====================================================

Baut eine kleine "Zauber-Quest-Liste" ein.

Die Liste soll mindestens 4 Aufgaben enthalten.

Beispiel:

- Boilerplate erstellen
- Navigation durch Hogwarts bauen
- Zauberstunden im Main-Bereich beschreiben
- Hermine-Tipp als Aside einfügen
- Nicht den falschen Zauberstab benutzen

BONUS:

Verlinkt innerhalb eurer Navigation mit href="#"
auf Platzhalter-Links.

Beispiel:

<a href="#">Zauberstunden</a>

=====================================================
EXTRA-NERD-BONUS
=====================================================

Schreibt irgendwo auf der Seite diesen Satz:

"Ein HTML-Dokument ist wie ein Zauberspruch:
Header, Main und Footer halten die Magie zusammen.
Wenn ein Tag fehlt, explodiert der Kessel."

=====================================================
ZIEL DER AUFGABE
=====================================================

Am Ende habt ihr eine vollständige HTML-Seite mit:

✓ Boilerplate
✓ Header
✓ Navigation
✓ Main-Bereich
✓ Sections
✓ Articles
✓ Aside
✓ Footer
✓ Listen
✓ Links
✓ Absätzen und Überschriften

Möge euer Code magisch sein.
Und möge euer Browser niemals rufen:
"EXPECTO FEHLERUM!"
===================================================== -->
