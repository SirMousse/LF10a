<!-- =====================================================
AUFGABE: DAS GROSSE HTML-ABENTEUER
=====================================================

Willkommen, mutige Entdecker!

Eine alte Karte wurde gefunden.
Sie führt zu einem verlorenen Tempel,
doch der Weg ist voller Bugs, vergessener Tags
und sehr verdächtiger Dschungelgeräusche.

Eure Aufgabe:
Erstellt eine strukturierte HTML-Seite für
das "Abenteuer-Team Codekompass".

Nur wenn eure Webseite sauber aufgebaut ist,
können alle Entdecker den Schatz finden.

=====================================================
PFLICHT-AUFGABE: STUFE 1 - RUCKSACKTRÄGER
=====================================================

Erstellt eine HTML-Datei mit vollständigem Boilerplate.

Eure Seite MUSS enthalten:

✓ <!DOCTYPE html>
✓ <html lang="de">
✓ <head> mit:
    - UTF-8
    - Viewport
    - passendem <title>

✓ <body> mit:
    - <header>
    - <nav>
    - <main>
    - <footer>

Im <header>:
✓ Eine <h1>-Überschrift

Beispiel:
"Das große HTML-Abenteuer"

Im <nav>:
✓ Eine ungeordnete Liste <ul>
✓ Mindestens 3 Listenpunkte <li>
✓ Jeder Listenpunkt enthält einen Link <a>

Beispiel:
- Startseite
- Schatzkarte
- Expedition

Im <main>:
✓ Mindestens eine <section>
✓ Eine <h2>-Überschrift
✓ Einen Absatz <p>

Im <footer>:
✓ Ein Copyright mit &copy;

Beispiel:
"© 2026 Abenteuer-Team Codekompass"

=====================================================
MITTLERE AUFGABE: STUFE 2 - DUNGSCHUNGEL-SCOUT
=====================================================

Erweitert eure Seite um einen Abschnitt
über eure Expedition.

In dieser <section> sollen mindestens 2 <article>
vorkommen.

Jeder <article> enthält:

✓ Eine <h3>-Überschrift
✓ Einen Absatz <p>
✓ Mindestens ein wichtiges Wort mit <strong>

Beispiel:

Artikel 1:
Überschrift:
"Die verlorene Karte"

Absatz:
"Die Gruppe findet eine <strong>alte Karte</strong>,
die den Weg zum Tempel des goldenen Codes zeigt."

Artikel 2:
Überschrift:
"Der Tempel der tausend Tags"

Absatz:
"Im Tempel warten Rätsel, Fallen und ein
sehr schlecht eingerückter HTML-Code."

=====================================================
SCHWERE AUFGABE: STUFE 3 - TEMPEL-PROFI
=====================================================

Fügt eine <aside>-Box hinzu.

Diese soll eine Zusatzinformation enthalten,
zum Beispiel einen lustigen Hinweis.

Beispiel:

Überschrift:
"Abenteuer-Tipp"

Absatz:
"Schließe immer deine HTML-Tags.<br>
Offene Tags sind wie offene Falltüren:
Irgendwann fällt jemand hinein."

Nutzt außerdem:

✓ Mindestens ein <br> für einen Zeilenumbruch
✓ Mindestens ein <hr> als thematische Trennlinie
✓ Mindestens eine Überschrift von <h1> bis <h3>

=====================================================
BOSS-LEVEL: STUFE 4 - SCHATZJÄGER-LEGENDE
=====================================================

Baut eine kleine "Expeditions-Liste" ein.

Die Liste soll mindestens 4 Aufgaben enthalten.

Beispiel:

- Boilerplate erstellen
- Navigation zur Schatzkarte bauen
- Expedition im Main-Bereich beschreiben
- Abenteuer-Tipp als Aside einfügen
- Nicht den Schatz mit einem Sandwich verwechseln

BONUS:

Verlinkt innerhalb eurer Navigation mit href="#"
auf Platzhalter-Links.

Beispiel:

<a href="#">Schatzkarte</a>

=====================================================
EXTRA-NERD-BONUS
=====================================================

Schreibt irgendwo auf der Seite diesen Satz:

"Ein HTML-Dokument ist wie eine gute Schatzkarte:
Header, Main und Footer geben dir Orientierung.
Wenn ein Tag fehlt, landest du im Bug-Sumpf."

=====================================================
ZIEL DER AUFGABE
=====================================================

Am Ende habt ihr eine vollständige HTML-Seite mit:

✓ Boilerplate
✓ Header
✓ Navigation
✓ Main-Bereich
✓ Sections
✓ Articles
✓ Aside
✓ Footer
✓ Listen
✓ Links
✓ Absätzen und Überschriften

Möge euer Code abenteuerlich sein.
Und möge euer Browser niemals rufen:
"404 - Schatz nicht gefunden!"
===================================================== -->
