<!--
==========================================
HTML & CSS ABENTEUER
QUEST OF CODE – DER VERLORENE CODE-KRISTALL
==========================================

STORY

Der magische Code-Kristall wurde gestohlen.
Ohne ihn verlieren alle Webseiten ihre Struktur,
Farben und Magie.

Du bist ein Code-Abenteurer und musst eine
mehrseitige Webseite erstellen, um den Kristall
zurückzubringen.

==========================================
AUFGABE
==========================================

Erstelle eine Webseite mit mindestens 4 Seiten:

- Startseite
- Abenteuer
- Helden
- Kontakt

Optional:

- Galerie
- Medienseite

==========================================
HTML-PFLICHTAUFGABEN
==========================================

[ ] Header erstellen
[ ] Logo einbauen
[ ] Navigation erstellen
[ ] Mehrere HTML-Seiten erstellen
[ ] Seiten miteinander verlinken
[ ] Überschriften verwenden
[ ] Absätze verwenden
[ ] Bilder einbauen
[ ] Listen verwenden
[ ] Tabelle erstellen
[ ] Formular erstellen
[ ] Audio einbauen
[ ] Video einbauen
[ ] Footer erstellen

==========================================
STARTSEITE
==========================================

Die Startseite soll enthalten:

- Logo
- Navigation
- Große Überschrift
- Begrüßungstext
- Bild zum Abenteuer

Beispiel:

Willkommen bei Quest of Code

Begib dich auf die Suche nach dem verlorenen
Code-Kristall.

==========================================
ABENTEUER-SEITE
==========================================

Erzähle die Geschichte deiner Reise.

Nutze:

- Überschriften
- Absätze
- Bilder

Erstelle außerdem:

Eine ungeordnete Liste mit deiner Ausrüstung:

- HTML-Schwert
- CSS-Schild
- Magische Tastatur
- Debugging-Trank

Und eine geordnete Liste mit den Quest-Schritten.

==========================================
HELDEN-SEITE
==========================================

Erstelle mindestens 3 Helden.

Jeder Held benötigt:

- Bild
- Name
- Klasse
- Level
- Spezialfähigkeit

Beispiel:

Sir Divus von Container
Klasse: HTML-Ritter
Level: 7

==========================================
TABELLEN-AUFGABE
==========================================

Erstelle eine Tabelle mit mindestens
4 Quest-Orten.

Spalten:

- Ort
- Aufgabe
- Gefahr
- Belohnung

==========================================
KONTAKT-SEITE
==========================================

Erstelle ein Formular mit:

- Name
- E-Mail
- Passwort
- Lieblingsheld
- Lieblingssprache
- Radio-Buttons
- Checkboxen
- Textarea
- Senden-Button

==========================================
MEDIA-AUFGABE
==========================================

Baue ein:

- Bild
- Audio
- Video

==========================================
CSS-PFLICHTAUFGABEN
==========================================

Verwende:

[ ] Externe CSS-Datei
[ ] Element-Selektoren
[ ] Klassen-Selektoren
[ ] ID-Selektoren
[ ] margin
[ ] padding
[ ] border
[ ] border-radius
[ ] Farben
[ ] Hover-Effekte
[ ] linear-gradient

==========================================
RECHERCHE-AUFGABEN
==========================================

Suche selbst heraus:

1. Wie bindet man Audio in HTML ein?
2. Wie bindet man Videos in HTML ein?
3. Was ist der Unterschied zwischen margin und padding?
4. Wie funktioniert linear-gradient?
5. Wie gestaltet man Tabellen mit CSS?
6. Wie erstellt man eine Sticky Navigation?

==========================================
BONUS-AUFGABEN
==========================================

- Galerie erstellen
- Sticky Navigation
- Responsive Design
- Hover-Effekte
- Google Fonts
- Animierte Buttons
- Dunkles Fantasy-Design
- Heldenkarten mit Schatten

==========================================
ENDBOSS
==========================================

Deine Webseite soll aussehen wie
ein Abenteuer-Spiel oder Fantasy-Menü.

Zeige alles, was du über HTML und CSS
gelernt hast.

Viel Erfolg bei deiner Quest.
