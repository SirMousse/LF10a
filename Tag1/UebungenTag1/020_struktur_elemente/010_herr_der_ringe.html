    =====================================================
    PFLICHT-AUFGABE: STUFE 1 - HOBBIT
    =====================================================

    Erstellt eine HTML-Datei mit vollständigem Boilerplate.

    Eure Seite MUSS enthalten:

    ✓ <!DOCTYPE html>
    ✓ <html lang="de">
    ✓ <head> mit:
        - UTF-8
        - Viewport
        - passendem <title>

    ✓ <body> mit:
        - <header>
        - <nav>
        - <main>
        - <footer>

    Im <header>:
    ✓ Eine <h1>-Überschrift

    Beispiel:
    "Der Rat von HTML-Rond"

    Im <nav>:
    ✓ Eine ungeordnete Liste <ul>
    ✓ Mindestens 3 Listenpunkte <li>
    ✓ Jeder Listenpunkt enthält einen Link <a>

    Beispiel:
    - Startseite
    - Die Gefährten
    - Der Weg nach Mordor

    Im <main>:
    ✓ Mindestens eine <section>
    ✓ Eine <h2>-Überschrift
    ✓ Einen Absatz <p>

    Im <footer>:
    ✓ Ein Copyright mit &copy;

    Beispiel:
    "© 2026 Rat von HTML-Rond"

    =====================================================
    MITTLERE AUFGABE: STUFE 2 - WALDLÄUFER
    =====================================================

    Erweitert eure Seite um einen eigenen Abschnitt
    über die Gefährten.

    In dieser <section> sollen mindestens 2 <article> vorkommen.
    
    Jeder <article> enthält:

    ✓ Eine <h3>-Überschrift
    ✓ Einen Absatz <p>
    ✓ Mindestens ein wichtiges Wort mit <strong>

    Beispiel:

    Artikel 1:
    Überschrift:
    "Frodo, der Ringträger"

    Absatz:
    "Frodo trägt den <strong>Einen Ring</strong>
    und muss ihn nach Mordor bringen."

    Artikel 2:
    Überschrift:
    "Sam, der wahre MVP"

    Absatz:
    "Sam folgt Frodo überallhin, sogar wenn
    das WLAN in Mordor schlecht ist."

    =====================================================
    SCHWERE AUFGABE: STUFE 3 - ZAUBERER
    =====================================================

    Fügt eine <aside>-Box hinzu.

    Diese soll eine Zusatzinformation enthalten,
    zum Beispiel einen nerdigen Hinweis.

    Beispiel:

    Überschrift:
    "Gandalfs HTML-Tipp"

    Absatz:
    "Du kannst nicht vorbei...
    ohne dein HTML sauber zu schließen!"

    Nutzt außerdem:

        ✓ Mindestens ein <br> für einen Zeilenumbruch
        ✓ Mindestens ein <hr> als thematische Trennlinie
        ✓ Mindestens eine Überschrift von <h1> bis <h3>

    =====================================================
    BOSS-LEVEL: STUFE 4 - MORDOR-MEISTER
    =====================================================

    Beispiel:

    - Boilerplate erstellen
    - Navigation bauen
    - Gefährten vorstellen
    - Ring nach Mordor bringen
    - Nicht von Gollum ablenken lassen

    BONUS:

    Verlinkt innerhalb eurer Navigation mit href="#"
    auf Platzhalter-Links.

    Beispiel:

    <a href="#">Die Gefährten</a>
