<!-- =====================================================
AUFGABE: OPERATION HTML-HACK
=====================================================

Alarm im Cyber-Labor!

Ein geheimer Server wurde gestartet,
aber seine Webseite ist noch leer.
Die Firewall piept, der Kaffee ist kalt
und im Code verstecken sich wilde Bugs.

Eure Aufgabe:
Erstellt eine strukturierte HTML-Seite für
das geheime "Hacker-Terminal Alpha".

Nur wenn eure Webseite sauber aufgebaut ist,
kann das System die Mission freischalten.

=====================================================
PFLICHT-AUFGABE: STUFE 1 - SCRIPT-KIDDIE
=====================================================

Erstellt eine HTML-Datei mit vollständigem Boilerplate.

Eure Seite MUSS enthalten:

✓ <!DOCTYPE html>
✓ <html lang="de">
✓ <head> mit:
    - UTF-8
    - Viewport
    - passendem <title>

✓ <body> mit:
    - <header>
    - <nav>
    - <main>
    - <footer>

Im <header>:
✓ Eine <h1>-Überschrift

Beispiel:
"Hacker-Terminal Alpha"

Im <nav>:
✓ Eine ungeordnete Liste <ul>
✓ Mindestens 3 Listenpunkte <li>
✓ Jeder Listenpunkt enthält einen Link <a>

Beispiel:
- Startseite
- Missionen
- Sicherheitsprotokoll

Im <main>:
✓ Mindestens eine <section>
✓ Eine <h2>-Überschrift
✓ Einen Absatz <p>

Im <footer>:
✓ Ein Copyright mit &copy;

Beispiel:
"© 2026 Cyber Security Agency"

=====================================================
MITTLERE AUFGABE: STUFE 2 - CODE-SPION
=====================================================

Erweitert eure Seite um einen Abschnitt
über geheime Cyber-Missionen.

In dieser <section> sollen mindestens 2 <article>
vorkommen.

Jeder <article> enthält:

✓ Eine <h3>-Überschrift
✓ Einen Absatz <p>
✓ Mindestens ein wichtiges Wort mit <strong>

Beispiel:

Artikel 1:
Überschrift:
"Mission: Firewall aktivieren"

Absatz:
"Agent Byte aktiviert die <strong>Firewall</strong>,
damit keine Bugs in das System eindringen."

Artikel 2:
Überschrift:
"Mission: Passwort retten"

Absatz:
"Das Passwort wurde auf einem USB-Stick gefunden,
der natürlich mit 'Passwort123' beschriftet war."

=====================================================
SCHWERE AUFGABE: STUFE 3 - FIREWALL-MEISTER
=====================================================

Fügt eine <aside>-Box hinzu.

Diese soll eine Zusatzinformation enthalten,
zum Beispiel einen nerdigen Hinweis.

Beispiel:

Überschrift:
"Cyber-Tipp"

Absatz:
"Schließe immer deine HTML-Tags.<br>
Offene Tags sind wie offene Ports:
Irgendwann kommt ein Bug vorbei."

Nutzt außerdem:

✓ Mindestens ein <br> für einen Zeilenumbruch
✓ Mindestens ein <hr> als thematische Trennlinie
✓ Mindestens eine Überschrift von <h1> bis <h3>

=====================================================
BOSS-LEVEL: STUFE 4 - TERMINAL-LEGende
=====================================================

Baut eine kleine "Mission-Liste" ein.

Die Liste soll mindestens 4 Aufgaben enthalten.

Beispiel:

- Boilerplate erstellen
- Navigation ins Terminal bauen
- Sicherheitsprotokoll schreiben
- Bug-Warnung als Aside einfügen
- Nicht auf den Button "Gratis WLAN" klicken

BONUS:

Verlinkt innerhalb eurer Navigation mit href="#"
auf Platzhalter-Links.

Beispiel:

<a href="#">Sicherheitsprotokoll</a>

=====================================================
EXTRA-NERD-BONUS
=====================================================

Schreibt irgendwo auf der Seite diesen Satz:

"Ein HTML-Dokument ist wie ein sicheres Netzwerk:
Header, Main und Footer halten alles zusammen.
Wenn ein Tag offen bleibt, ist das wie ein offener Port."

=====================================================
ZIEL DER AUFGABE
=====================================================

Am Ende habt ihr eine vollständige HTML-Seite mit:

✓ Boilerplate
✓ Header
✓ Navigation
✓ Main-Bereich
✓ Sections
✓ Articles
✓ Aside
✓ Footer
✓ Listen
✓ Links
✓ Absätzen und Überschriften

Möge euer Code sicher sein.
Und möge euer Browser niemals melden:
"ACCESS DENIED - fehlender End-Tag!"
===================================================== -->
