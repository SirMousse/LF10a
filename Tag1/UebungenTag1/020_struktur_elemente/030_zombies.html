<!-- =====================================================
AUFGABE: HTML APOKALYPSE - DIE ZOMBIE-ZONE
=====================================================

Alarm, Überlebende!

Die Zombie-Apokalypse ist ausgebrochen.
Die Server der Sicherheitszone sind offline,
die Navigation wurde von Zombies angeknabbert
und überall liegen ungeordnete Tags herum.

Eure Aufgabe:
Erstellt eine strukturierte HTML-Seite für
die "Sicherheitszone Alpha".

Nur wenn eure Webseite sauber aufgebaut ist,
können die Überlebenden wichtige Informationen
finden und der Zombie-Horde entkommen.

=====================================================
PFLICHT-AUFGABE: STUFE 1 - ÜBERLEBENDER
=====================================================

Erstellt eine HTML-Datei mit vollständigem Boilerplate.

Eure Seite MUSS enthalten:

✓ <!DOCTYPE html>
✓ <html lang="de">
✓ <head> mit:
    - UTF-8
    - Viewport
    - passendem <title>

✓ <body> mit:
    - <header>
    - <nav>
    - <main>
    - <footer>

Im <header>:
✓ Eine <h1>-Überschrift

Beispiel:
"Sicherheitszone Alpha"

Im <nav>:
✓ Eine ungeordnete Liste <ul>
✓ Mindestens 3 Listenpunkte <li>
✓ Jeder Listenpunkt enthält einen Link <a>

Beispiel:
- Startseite
- Vorratslager
- Notfallplan

Im <main>:
✓ Mindestens eine <section>
✓ Eine <h2>-Überschrift
✓ Einen Absatz <p>

Im <footer>:
✓ Ein Copyright mit &copy;

Beispiel:
"© 2026 Sicherheitszone Alpha"

=====================================================
MITTLERE AUFGABE: STUFE 2 - ZOMBIE-SCOUT
=====================================================

Erweitert eure Seite um einen Abschnitt
über das Überleben in der Zombie-Zone.

In dieser <section> sollen mindestens 2 <article>
vorkommen.

Jeder <article> enthält:

✓ Eine <h3>-Überschrift
✓ Einen Absatz <p>
✓ Mindestens ein wichtiges Wort mit <strong>

Beispiel:

Artikel 1:
Überschrift:
"Das Vorratslager sichern"

Absatz:
"Die Überlebenden sammeln <strong>Wasser</strong>,
Konserven und Taschenlampen für die nächste Nacht."

Artikel 2:
Überschrift:
"Die Zombie-Horde beobachten"

Absatz:
"Ein Scout zählt die Zombies vor dem Tor,
während jemand versucht, das WLAN zu retten."

=====================================================
SCHWERE AUFGABE: STUFE 3 - APOKALYPSEN-PROFI
=====================================================

Fügt eine <aside>-Box hinzu.

Diese soll eine Zusatzinformation enthalten,
zum Beispiel einen nerdigen Hinweis.

Beispiel:

Überschrift:
"Überlebens-Tipp"

Absatz:
"Schließe immer deine HTML-Tags.<br>
Offene Tags locken Zombies, Bugs und
sehr enttäuschte Browser an."

Nutzt außerdem:

✓ Mindestens ein <br> für einen Zeilenumbruch
✓ Mindestens ein <hr> als thematische Trennlinie
✓ Mindestens eine Überschrift von <h1> bis <h3>

=====================================================
BOSS-LEVEL: STUFE 4 - ZOMBIE-BOSS-BESIEGER
=====================================================

Baut eine kleine "Überlebens-Liste" ein.

Die Liste soll mindestens 4 Aufgaben enthalten.

Beispiel:

- Boilerplate erstellen
- Navigation zur Sicherheitszone bauen
- Vorräte im Main-Bereich beschreiben
- Zombie-Warnung als Aside einfügen
- Nicht den letzten Müsliriegel essen

BONUS:

Verlinkt innerhalb eurer Navigation mit href="#"
auf Platzhalter-Links.

Beispiel:

<a href="#">Notfallplan</a>
