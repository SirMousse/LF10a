<!-- =====================================================
AUFGABE: DAS HTML-TIERHEIM PFOTENGLÜCK
=====================================================

Willkommen, Tierfreunde!

Im Tierheim Pfotenglück ist viel los.
Die Hunde bellen, die Katzen bewerten alles
kritisch und der Hamster hat die Navigation
in seinem Laufrad versteckt.

Eure Aufgabe:
Erstellt eine strukturierte HTML-Seite für
das "Tierheim Pfotenglück".

Nur wenn eure Webseite sauber aufgebaut ist,
können Besucher die Tiere kennenlernen.

=====================================================
PFLICHT-AUFGABE: STUFE 1 - FUTTERNAPF-FÜLLER
=====================================================

Erstellt eine HTML-Datei mit vollständigem Boilerplate.

Eure Seite MUSS enthalten:

✓ <!DOCTYPE html>
✓ <html lang="de">
✓ <head> mit:
    - UTF-8
    - Viewport
    - passendem <title>

✓ <body> mit:
    - <header>
    - <nav>
    - <main>
    - <footer>

Im <header>:
✓ Eine <h1>-Überschrift

Beispiel:
"Tierheim Pfotenglück"

Im <nav>:
✓ Eine ungeordnete Liste <ul>
✓ Mindestens 3 Listenpunkte <li>
✓ Jeder Listenpunkt enthält einen Link <a>

Beispiel:
- Startseite
- Unsere Tiere
- Kontakt

Im <main>:
✓ Mindestens eine <section>
✓ Eine <h2>-Überschrift
✓ Einen Absatz <p>

Im <footer>:
✓ Ein Copyright mit &copy;

Beispiel:
"© 2026 Tierheim Pfotenglück"

=====================================================
MITTLERE AUFGABE: STUFE 2 - GASSI-HELD
=====================================================

Erweitert eure Seite um einen Abschnitt
über Tiere, die ein Zuhause suchen.

In dieser <section> sollen mindestens 2 <article>
vorkommen.

Jeder <article> enthält:

✓ Eine <h3>-Überschrift
✓ Einen Absatz <p>
✓ Mindestens ein wichtiges Wort mit <strong>

Beispiel:

Artikel 1:
Überschrift:
"Bello sucht ein Sofa"

Absatz:
"Bello ist ein <strong>freundlicher Hund</strong>,
der gerne spazieren geht und Snacks liebt."

Artikel 2:
Überschrift:
"Minka sucht Personal"

Absatz:
"Minka ist eine Katze mit Stil.
Sie sucht Menschen, die ihre Futterschale
pünktlich auffüllen."

=====================================================
SCHWERE AUFGABE: STUFE 3 - PFOTEN-PROFI
=====================================================

Fügt eine <aside>-Box hinzu.

Diese soll eine Zusatzinformation enthalten,
zum Beispiel einen lustigen Hinweis.

Beispiel:

Überschrift:
"Tierheim-Tipp"

Absatz:
"Schließe immer deine HTML-Tags.<br>
Offene Tags werden sonst von den Katzen
vom Tisch geschubst."

Nutzt außerdem:

✓ Mindestens ein <br> für einen Zeilenumbruch
✓ Mindestens ein <hr> als thematische Trennlinie
✓ Mindestens eine Überschrift von <h1> bis <h3>

=====================================================
BOSS-LEVEL: STUFE 4 - TIERFLÜSTERER
=====================================================

Baut eine kleine "Tierheim-Aufgabenliste" ein.

Die Liste soll mindestens 4 Aufgaben enthalten.

Beispiel:

- Boilerplate erstellen
- Navigation zum Tierheim bauen
- Tiere im Main-Bereich vorstellen
- Tierheim-Tipp als Aside einfügen
- Nicht alle Tiere heimlich adoptieren

BONUS:

Verlinkt innerhalb eurer Navigation mit href="#"
auf Platzhalter-Links.

Beispiel:

<a href="#">Unsere Tiere</a>

=====================================================
EXTRA-NERD-BONUS
=====================================================

Schreibt irgendwo auf der Seite diesen Satz:

"Ein HTML-Dokument ist wie ein gutes Tierheim:
Header, Main und Footer geben allem Struktur.
Wenn ein Tag fehlt, miaut der Browser beleidigt."

=====================================================
ZIEL DER AUFGABE
=====================================================

Am Ende habt ihr eine vollständige HTML-Seite mit:

✓ Navigation
✓ Main-Bereich
✓ Sections

Möge euer Code flauschig sein.
Und möge euer Browser niemals bellen:
"WUFF - fehlender End-Tag!"
===================================================== -->
